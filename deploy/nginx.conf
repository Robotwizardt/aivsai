# aivsai 站点配置：托管前端静态文件，/api 反代到后端容器。
# 部署形态见 ADR 与 docs/（方案：nginx 托管前端 + 反代后端，前端 hash 路由）。

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip 静态资源（vite 产物已带 hash 指纹，可长缓存）
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 前端 hash 路由（#/xxx）：/ 永远只命中 index.html，try_files 兜底无害
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API + SSE + WebSocket 全部转发到后端容器（compose 服务名即主机名）
    location /api/ {
        proxy_pass http://aivsai-server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE（对局直播帧流 /api/matches/:id/frames）：必须关缓冲，否则直播被攒批卡住
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;

        # WebSocket（@fastify/websocket）升级头；$connection_upgrade 来自 00-ws-map.conf
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
